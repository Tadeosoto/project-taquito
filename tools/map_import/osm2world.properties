# Ajustes de OSM2World para el mapa. build_glb.sh los agrega al final de
# standard.properties (el estilo por defecto de OSM2World), asi que aqui solo
# va lo que cambia.

# El piso lo pone Godot (scenes/map_test.tscn), no hace falta terreno
createTerrain = false

# Lee building:colour (prepare_osm.py rellena los que faltan)
useBuildingColors = true

# Arboles como mallas, no como billboards (en glTF los billboards no giran)
useBillboards = false
